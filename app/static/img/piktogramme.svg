<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- ===========================================================================
     Bereichs-Piktogramme im Stil von Sicherheitspostern der 1950er:
     Strichzeichnung, zwei Farben, keine Verlaeufe, keine Marken Dritter.
     Alle 24x24. Umriss = currentColor, Akzent = opacity .45.

     WICHTIG: Farben und Strichstaerken stehen als Praesentationsattribute
     direkt an den Elementen, NICHT in einem <style>-Block. Bei externem
     <use href="datei.svg#id"> uebernehmen die Browser die Stylesheets des
     referenzierten Dokuments nicht zuverlaessig - Attribute dagegen schon.

     Verwendung:  <svg class="pikto"><use href="/static/img/piktogramme.svg#p-blitz"/></svg>
     =========================================================================== -->

<!-- 1 Elektrotechnik: Blitz -->
<symbol id="p-blitz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
