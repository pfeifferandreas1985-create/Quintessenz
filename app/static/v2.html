<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUINTESSENZ V2</title>
<style>
  :root { --p:#3FC8FF; --h:#CFF7FF; --a:#FF8A00; --bg:#05080b; --dim:#17495c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--p); overflow:hidden;
              font:14px/1.45 "IBM Plex Mono","Courier Prime","Consolas",monospace;
              user-select:none; -webkit-user-select:none; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:90; opacity:.16;
                 background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.6) 2px 3px); }

  /* Ruhezustand ist "aus". body.on setzt "an" fest und spielt das Einschalten ab; kein
     animation-fill-mode, sonst nimmt eine spaetere Animation (Ruettler) den Endzustand mit. */
  #stage { position:relative; width:100%; height:100%; background:var(--bg);
           transform:scaleY(0); opacity:0; }
  body.on #stage { transform:none; opacity:1; animation:crt-on .85s cubic-bezier(.2,.9,.2,1); }
  body.on #stage::after { content:""; position:absolute; inset:0; background:#fff; opacity:0;
                          pointer-events:none; z-index:40; animation:crt-flicker 1.5s steps(1) .3s; }

  section { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
            pointer-events:none; transition:opacity .45s; }
  section.on { opacity:1; pointer-events:auto; }

  /* ---------- Vorspann und Countdown ---------- */
  #s-count { text-align:center; }
  #preface { position:absolute; text-align:center; opacity:0; }
  #preface.on { opacity:1; animation:pre-out .5s ease-in 1.9s forwards; }
  #preface .wort { font-size:clamp(24px,6vw,68px); font-weight:700; letter-spacing:.3em; text-indent:.3em;
                   color:var(--h); text-shadow:0 0 30px var(--p),0 0 70px rgba(63,200,255,.45); white-space:nowrap; }
  #preface .wort span { display:inline-block; opacity:0; }
  #preface.on .wort span { animation:pre-letter .55s cubic-bezier(.2,.9,.2,1) forwards;
                           animation-delay:calc(var(--i) * 65ms); }
  #preface .strich { height:2px; margin:18px auto 0; width:0; background:var(--p); box-shadow:0 0 14px var(--p); }
  #preface.on .strich { animation:pre-line .9s cubic-bezier(.2,.9,.2,1) .55s forwards; }
  #preface .unter { margin-top:14px; font-size:11px; letter-spacing:.5em; text-indent:.5em; opacity:0; }
  #preface.on .unter { animation:pre-sub .6s ease-out 1.1s forwards; }

  #count { position:relative; width:min(46vmin,320px); aspect-ratio:1; display:grid; place-items:center;
           opacity:0; transition:opacity .3s; }
  #count.on { opacity:1; }
  #count svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #count circle { fill:none; transform:rotate(-90deg); transform-origin:100px 100px; }
  .ring-bg { stroke:var(--dim); stroke-width:1.5; stroke-dasharray:3 7; }
  .ring-go { stroke:var(--p); stroke-width:3.5; stroke-linecap:round; stroke-dasharray:540.35;
             stroke-dashoffset:540.35; filter:drop-shadow(0 0 8px var(--p)); }
  .ring-go.go { animation:ring-run 1s linear forwards; }
  .ring-in { stroke:var(--p); stroke-width:1; opacity:.35; }
  .ring-in.go { animation:ring-pulse 1s ease-out; }
  #count-num { position:relative; font-size:min(22vmin,150px); font-weight:700; line-height:1; color:var(--h);
               text-shadow:0 0 30px var(--p),0 0 60px rgba(63,200,255,.5); }
  #count-num.beat { animation:num-in .95s cubic-bezier(.2,.8,.2,1); }
  #count-cap { position:absolute; bottom:-8%; left:0; right:0; font-size:12px; letter-spacing:.45em;
               text-indent:.45em; opacity:.65; }

  /* ---------- Bildstoerung ---------- */
  #glitch { position:absolute; inset:0; z-index:35; pointer-events:none; opacity:0; overflow:hidden; }
  #glitch.on { opacity:1; }
  #glitch i { position:absolute; left:-10%; right:-10%; display:block; background:var(--c); opacity:.34;
              mix-blend-mode:screen; transform:translateX(var(--dx));
              animation:g-slice var(--t) steps(2) infinite alternate; }
  #glitch b { position:absolute; left:0; right:0; height:2px; background:var(--h); opacity:.75;
              box-shadow:0 0 24px var(--h); animation:g-sweep .5s linear infinite; }
  #glitch::after { content:""; position:absolute; inset:-20%; opacity:.1; mix-blend-mode:screen;
                   background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 1px,transparent 1px 5px);
                   animation:g-noise .08s steps(2) infinite; }
  body.glitching #stage { animation:g-shake .09s steps(2) infinite; }

  /* ---------- Systemcheck ---------- */
  #s-boot { place-items:start; padding:6vh 6vw; }
  #boot { margin:0; white-space:pre-wrap; font-size:clamp(12px,1.6vw,18px); line-height:1.7;
          color:var(--p); text-shadow:0 0 8px rgba(63,200,255,.6); }
  #boot .ok { color:#6CFF9A; }
  #boot .warn { color:var(--a); }
  #boot .cur { display:inline-block; width:.6em; height:1.1em; background:var(--p); vertical-align:-.2em;
               animation:blink .8s steps(1) infinite; }
  #boot span.g { display:inline-block; will-change:transform,opacity; }

  /* ---------- Navigation ---------- */
  #s-nav { display:block; }
  #ringe { position:absolute; inset:0; pointer-events:none; }
  #ringe circle { fill:none; stroke:var(--dim); opacity:.5; }
  #ringe .lauf { stroke:var(--p); stroke-width:1.2; stroke-dasharray:4 12; opacity:.45;
                 transform-origin:center; animation:drehen 60s linear infinite; }
  #linien { position:absolute; inset:0; pointer-events:none; z-index:1; }
  #linien line { stroke:var(--p); stroke-width:1; opacity:.28; stroke-dasharray:3 5;
                 animation:fliessen 1.6s linear infinite; }

  #nabe { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center;
          pointer-events:none; z-index:2; opacity:0; transition:opacity .6s .5s; }
  #s-nav.on #nabe { opacity:1; }
  #nabe b { display:block; font-size:clamp(17px,2.3vw,30px); letter-spacing:.42em; text-indent:.42em;
            color:var(--h); text-shadow:0 0 26px var(--p); font-weight:700; }
  #nabe span { display:block; margin-top:9px; font-size:10px; letter-spacing:.42em; text-indent:.42em; opacity:.5; }
  #nabe em { display:block; margin-top:20px; font-size:10px; letter-spacing:.28em; opacity:.35; font-style:normal; }

  .knoten { position:absolute; transform:translate(-50%,-50%) scale(var(--s,1));
            display:grid; place-items:center; cursor:pointer; z-index:3;
            transition:opacity .25s, transform .3s cubic-bezier(.2,.9,.3,1.2), filter .25s; }
  .knoten .scheibe { position:relative; display:grid; place-items:center; border-radius:50%; }
  .knoten svg { width:100%; height:100%; display:block; pointer-events:none; }
  .knoten .titel { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;
                   pointer-events:none; letter-spacing:.2em; text-indent:.2em; }
  .ebene1 { opacity:0; }
  .ebene1.da { animation:knoten-an .8s cubic-bezier(.2,.9,.3,1.2) forwards;
               animation-delay:calc(var(--i,0) * 110ms); }
  .ebene1 .scheibe { width:var(--d); height:var(--d); }
  .ebene1 .titel { bottom:-22px; font-size:12px; font-weight:700; }
  .ebene2 .scheibe { width:var(--d); height:var(--d);
                     background:radial-gradient(circle,rgba(10,30,40,.9) 0,rgba(5,10,14,.2) 70%); }
  .ebene2 .titel { bottom:-17px; font-size:10px; }
  .ebene3 { --d:0; }
  .ebene3 .pille { padding:6px 11px; border:1px solid var(--dim); border-radius:14px; font-size:10.5px;
                   background:rgba(6,16,22,.92); white-space:nowrap; letter-spacing:.05em;
                   box-shadow:0 0 14px rgba(0,0,0,.6); }
  .knoten:hover { --s:1.1; }
  .knoten:hover .titel { color:var(--f,var(--h)); }
  .knoten:hover svg { filter:drop-shadow(0 0 14px var(--f,var(--p))); }
  .ebene3:hover .pille { border-color:var(--f,var(--h)); color:var(--f,var(--h));
                         box-shadow:0 0 16px color-mix(in srgb,var(--f,var(--p)) 40%,transparent); }
  .blase { opacity:0; pointer-events:none; --s:.25; }
  .blase.auf { opacity:1; pointer-events:auto; --s:1; transition-delay:calc(var(--i,0) * 45ms); }
  .abgeblendet { opacity:.18; filter:grayscale(.6); }

  /* ---------- Panel ---------- */
  #panel { position:absolute; top:0; right:0; height:100%; width:min(430px,86vw); z-index:20;
           background:linear-gradient(200deg,rgba(8,22,30,.97),rgba(4,9,13,.99));
           border-left:1px solid var(--dim); transform:translateX(102%);
           transition:transform .4s cubic-bezier(.2,.9,.2,1); display:flex; flex-direction:column; }
  #panel.auf { transform:none; }
  #panel.auf #zu { opacity:1; pointer-events:auto; }
  #panel header { padding:22px 22px 14px; border-bottom:1px solid var(--dim); }
  #pfad { font-size:10px; letter-spacing:.24em; opacity:.5; margin-bottom:9px; }
  #panel h2 { margin:0; font-size:21px; letter-spacing:.2em; color:var(--f,var(--h)); font-weight:700; }
  #zahlen { display:flex; gap:18px; margin-top:13px; font-size:10px; opacity:.62; letter-spacing:.1em; }
  #zahlen b { display:block; font-size:16px; color:var(--f,var(--p)); letter-spacing:.05em; }
  #liste { padding:16px 22px; overflow-y:auto; flex:1; }
  .funktion { display:block; width:100%; text-align:left; margin-bottom:11px; padding:13px 15px;
              background:rgba(63,200,255,.045); border:1px solid var(--dim); border-radius:5px;
              color:var(--p); font:inherit; cursor:pointer; transition:.18s; }
  .funktion:hover { border-color:var(--f,var(--h)); background:color-mix(in srgb,var(--f,var(--p)) 12%,transparent);
                    transform:translateX(4px); }
  .funktion b { display:block; font-size:12px; letter-spacing:.16em; color:var(--f,var(--h)); margin-bottom:5px; }
  .funktion span { font-size:11px; opacity:.72; line-height:1.5; }
  #panel footer { padding:14px 22px; border-top:1px solid var(--dim); font-size:10px; opacity:.45; letter-spacing:.14em; }
  #zu { position:absolute; left:-1px; top:14px; transform:translateX(-100%); opacity:0; pointer-events:none;
        transition:opacity .3s; background:rgba(8,22,30,.97); border:1px solid var(--dim); border-right:0;
        color:var(--p); font:inherit; font-size:11px; padding:9px 12px; cursor:pointer; border-radius:5px 0 0 5px; }
  #zu:hover { color:var(--h); border-color:var(--h); }

  #hinweis { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:30;
             padding:11px 18px; border:1px solid var(--a); border-radius:5px; color:var(--a);
             background:rgba(8,22,30,.95); font-size:11px; letter-spacing:.14em; opacity:0;
             pointer-events:none; transition:opacity .3s; white-space:nowrap; }
  #hinweis.auf { opacity:1; }
  #fuss { position:absolute; left:20px; bottom:16px; font-size:10px; letter-spacing:.2em; opacity:0;
          transition:opacity .6s 1s; }
  #s-nav.on ~ #fuss, #s-nav.on #fuss { opacity:.35; }
  .skip { position:fixed; right:18px; bottom:14px; font-size:11px; letter-spacing:.2em; opacity:.5; z-index:60;
          color:var(--p); border:1px solid var(--dim); padding:6px 10px; cursor:pointer; background:none;
          font-family:inherit; }
  .skip:hover { opacity:1; border-color:var(--p); }

  @keyframes crt-on { 0% { transform:scaleY(.004) scaleX(.6); opacity:0; }
                      18% { transform:scaleY(.004) scaleX(1); opacity:1; }
                      100% { transform:scaleY(1) scaleX(1); opacity:1; } }
  @keyframes crt-flicker { 0%,6%,12%,100% { opacity:0; } 3% { opacity:.5; } 9% { opacity:.18; } }
  @keyframes pre-letter { 0% { opacity:0; transform:translateY(14px) scale(1.25); filter:blur(7px); }
                          100% { opacity:1; transform:none; filter:blur(0); } }
  @keyframes pre-line { to { width:min(62vw,520px); } }
  @keyframes pre-sub { to { opacity:.6; } }
  @keyframes pre-out { to { opacity:0; transform:scale(1.06); filter:blur(3px); } }
  @keyframes ring-run { from { stroke-dashoffset:540.35; } to { stroke-dashoffset:0; } }
  @keyframes ring-pulse { 0% { transform:rotate(-90deg) scale(1); opacity:.45; }
                          100% { transform:rotate(-90deg) scale(1.25); opacity:0; } }
  @keyframes num-in { 0% { opacity:0; transform:scale(1.7); filter:blur(6px); }
                      22% { opacity:1; transform:scale(1); filter:blur(0); }
                      80% { opacity:1; } 100% { opacity:.15; transform:scale(.94); } }
  @keyframes g-slice { from { transform:translateX(var(--dx)); } to { transform:translateX(calc(var(--dx) * -.7)); } }
  @keyframes g-sweep { from { top:-4%; } to { top:104%; } }
  @keyframes g-noise { 0% { transform:translateY(0); } 100% { transform:translateY(3px); } }
  @keyframes g-shake { 0% { transform:translate(0,0); } 33% { transform:translate(-6px,2px) skewX(.6deg); }
                       66% { transform:translate(5px,-2px) skewX(-.5deg); } 100% { transform:translate(0,0); } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:.15; } }
  @keyframes drehen { to { transform:rotate(360deg); } }
  @keyframes fliessen { to { stroke-dashoffset:-16; } }
  @keyframes knoten-an { from { opacity:0; transform:translate(-50%,-50%) scale(.2); }
                         to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @media (prefers-reduced-motion:reduce) { * { animation-duration:.001s !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-stark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
<template id="sym-AW"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bereich ARCHIV">
  <title data-size="200">ARCHIV</title>
  <!-- Bereichslogo AW · ARCHIV · Quintessenz-Terminal · erzeugt von build_icons.py -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-stark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    :root { --p: #3FC8FF; --h: #CFF7FF; --a: #FF8A00; }
    svg { --f: 1; }
    svg:hover { --f: .22; }
    .linie { fill: none; stroke: var(--p); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.4; }
    .fuell { fill: var(--p); stroke: none; }
    .duenn { stroke-width: 1.4; }
    .dick  { stroke-width: 3.4; }
    .motiv { filter: url(#glow); }
    svg:hover .motiv { filter: url(#glow-stark); }
    svg:hover .linie { stroke: var(--h); }
    svg:hover .fuell { fill: var(--h); }
    svg:hover .akzent { stroke: var(--a); }
    svg:hover .akzent-fuell { fill: var(--a); }
    .ring-aussen { stroke-width: 2; stroke-dasharray: 34 10 4 10; --t: 24s; --o: 100px 96px; }
    .ring-innen  { stroke-width: 1; stroke-dasharray: 2 6; opacity: .7; --t: 16s; --o: 100px 96px; }
    .ring-marke  { stroke-width: 3; stroke-dasharray: 6 214; --t: 6s; --o: 100px 96px; }
    svg:hover .ring-marke { stroke: var(--a); }
    .anim-drehen   { animation: drehen calc(var(--t) * var(--f)) linear infinite; transform-origin: var(--o); }
    .anim-drehen-r { animation: drehen calc(var(--t) * var(--f)) linear infinite reverse; transform-origin: var(--o); }
    .anim-pendeln  { animation: pendeln calc(var(--t) * var(--f)) ease-in-out infinite alternate; transform-origin: var(--o); }
    .anim-fliessen { stroke-dasharray: var(--d, 5 7); animation: fliessen calc(var(--t) * var(--f)) linear infinite; }
    .anim-atmen    { animation: atmen calc(var(--t) * var(--f)) ease-in-out infinite; }
    .anim-blinken  { animation: blinken calc(var(--t) * var(--f)) steps(1) infinite; }
    .anim-pulsieren{ animation: pulsieren calc(var(--t) * var(--f)) ease-out infinite; transform-origin: var(--o); }
    .anim-blicken  { animation: blicken calc(var(--t) * var(--f)) ease-in-out infinite; }
    .anim-wippen   { animation: wippen calc(var(--t) * var(--f)) ease-in-out infinite alternate; }
    svg:hover .hover-flackern { animation: flackern .9s steps(1) infinite; }
    .funke { opacity: 0; transform-origin: 100px 96px; stroke-width: 2; }
    svg:hover .funke { animation: funkeln 1.1s ease-out infinite; stroke: var(--a); }
    .schild { fill: var(--p); font: 700 13px/1 "Jost", "League Spartan", "Futura", "Century Gothic", sans-serif;
              letter-spacing: 3.5px; text-anchor: middle; }
    svg:hover .schild { fill: var(--h); }
    @keyframes drehen    { to { transform: rotate(360deg); } }
    @keyframes pendeln   { from { transform: rotate(calc(-1 * var(--w, 12deg))); } to { transform: rotate(var(--w, 12deg)); } }
    @keyframes fliessen  { to { stroke-dashoffset: var(--v, -24); } }
    @keyframes atmen     { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes blinken   { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
    @keyframes pulsieren { 0% { transform: scale(.92); opacity: .8; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(.92); opacity: .8; } }
    @keyframes blicken   { 0%, 20% { transform: translateX(-6px); } 45%, 65% { transform: translateX(6px); } 85%, 100% { transform: translateX(-6px); } }
    @keyframes wippen    { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
    @keyframes flackern  { 0% { opacity: 1; } 12% { opacity: .35; } 20% { opacity: 1; } 47% { opacity: .9; }
                           55% { opacity: .2; } 62% { opacity: 1; } 81% { opacity: .6; } 88% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes funkeln   { 0% { opacity: 0; transform: scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  </style>
  <rect width="200" height="200" fill="transparent"/>
  <circle class="linie ring-aussen anim-drehen"   cx="100" cy="96" r="80"/>
  <circle class="linie ring-innen  anim-drehen-r" cx="100" cy="96" r="71"/>
  <circle class="linie ring-marke  anim-drehen"   cx="100" cy="96" r="80"/>
  <g class="motiv">

    <g class="anim-drehen" style="--t:24s;--o:100px 60px">
      <circle class="linie" cx="100" cy="60" r="20"/>
    </g>
    <ellipse class="linie duenn anim-fliessen" style="--t:4s;--d:4 4" cx="100" cy="60" rx="20" ry="7"/>
    <ellipse class="linie duenn" cx="100" cy="60" rx="8" ry="20"/>
    <path class="linie duenn" d="M80 60 H120"/>
    <path class="linie" d="M54 96 C70 88 88 90 100 98 L100 146 C88 138 70 136 54 144 Z"/>
    <path class="linie" d="M146 96 C130 88 112 90 100 98 L100 146 C112 138 130 136 146 144 Z"/>
    <path class="linie duenn anim-fliessen" style="--t:3s;--d:30 8;--v:-38" d="M62 104 C74 99 86 100 94 105 M62 114 C74 109 86 110 94 115 M62 124 C74 119 86 120 94 125"/>
    <path class="linie duenn anim-fliessen" style="--t:3s;--d:30 8;--v:-38;animation-delay:-1.5s" d="M138 104 C126 99 114 100 106 105 M138 114 C126 109 114 110 106 115 M138 124 C126 119 114 120 106 125"/>
    <path class="linie funke" d="M128 44 l8 -6 M130 56 l10 0"/>
  </g>
  
</svg></template>
<template id="sym-EL"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bereich ELEKTRIK">
  <title data-size="200">ELEKTRIK</title>
  <!-- Bereichslogo EL · ELEKTRIK · Quintessenz-Terminal · erzeugt von build_icons.py -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-stark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    :root { --p: #3FC8FF; --h: #CFF7FF; --a: #FF8A00; }
    svg { --f: 1; }
    svg:hover { --f: .22; }
    .linie { fill: none; stroke: var(--p); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.4; }
    .fuell { fill: var(--p); stroke: none; }
    .duenn { stroke-width: 1.4; }
    .dick  { stroke-width: 3.4; }
    .motiv { filter: url(#glow); }
    svg:hover .motiv { filter: url(#glow-stark); }
    svg:hover .linie { stroke: var(--h); }
    svg:hover .fuell { fill: var(--h); }
    svg:hover .akzent { stroke: var(--a); }
    svg:hover .akzent-fuell { fill: var(--a); }

, "Medikamente und Dosierung", "Infektionen", "Anatomie"]}, {"id": "M3", "name": "OHNE ARZT", "farbe": "#FFA8D6", "sym": "MD", "themen": ["Untersuchung", "Geburt", "Chirurgie mit einfachen Mitteln", "Zaehne", "Versorgung ueber Tage"]}, {"id": "M4", "name": "HYGIENE", "farbe": "#FFC7E4", "sym": "MD", "themen": ["Wasseraufbereitung", "Wasserqualitaet", "Seuchenschutz"]}]}, {"id": "ARC", "name": "ARCHIVE", "farbe": "#FFF1B8", "sym": "AW", "kinder": [{"id": "AW", "name": "WISSEN", "farbe": "#FFF1B8", "sym": "AW", "themen": ["Wikipedia", "Buecher und Literatur", "Lehrbuecher und Kurse", "Woerterbuch", "Fachforen"]}, {"id": "KN", "name": "MAPS", "farbe": "#2EF2C0", "sym": "KN", "themen": ["Weltkarte", "Europa und DACH", "Deutschland", "Routing", "Orte in der Naehe", "Hoehenlinien"]}]}, {"id": "ASS", "name": "ASSISTENT", "farbe": "#FF3DF5", "sym": "KI", "kinder": []}];
  const FUNKTIONEN = [{"id": "fragen", "name": "FRAGE STELLEN", "text": "Frage in normaler Sprache. Die Antwort kommt aus den Quellen dieses Bereichs und nennt die Fundstelle."}, {"id": "arbeiten", "name": "MIT KI ARBEITEN", "text": "Laengeres Gespraech im Bereich: rechnen lassen, uebersetzen, zusammenfassen, Schritt fuer Schritt anleiten."}, {"id": "quellen", "name": "QUELLEN EINSEHEN", "text": "Alle Archive, Handbuecher und Dokumente dieses Bereichs durchblaettern und im Original lesen."}, {"id": "drucken", "name": "QUELLEN DRUCKEN", "text": "Ausgewaehlte Seiten als PDF sammeln und drucken, fuer den Fall, dass kein Geraet mehr laeuft."}, {"id": "lehrblatt", "name": "LEHRBLATT ERZEUGEN", "text": "Eine Doppelseite zum Thema setzen: Text, Schnittzeichnung, Warnhinweise, Fehlertabelle."}, {"id": "foto", "name": "FOTO ERKLAEREN", "text": "Typenschild, Schaltplanausschnitt oder Bauteil fotografieren und im Zusammenhang dieses Bereichs deuten."}];
  const LINES = ["QUINTESSENZ TERMINAL  //  BIOS 2.0  //  ATOMIC AGE EDITION", "", "CPU ........ ARM CORTEX-A76 x4 @ 2.4 GHZ .......... OK", "MEMORY ..... 16384 MB ............................ OK", "STORAGE .... /srv/box  740 GB, READ-ONLY ......... OK", "KIWIX ...... 39 ARCHIVES, 2 LANGUAGES ............ OK", "MAPS ....... WORLD / EUROPE / DACH / GERMANY ..... OK", "MODELS ..... 9 LOADED, NO CLOUD .................. OK", "NETWORK .... NONE (BY DESIGN) .................... OK", "", "SCANNING KNOWLEDGE GROUPS ........................ 5 FOUND", "INITIALIZING INTERFACE"];
  const $ = s => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skipped = false;

  // Warten und Tippen haengen am Bildtakt, nicht an setTimeout: Browser drosseln Timer
  // (Hintergrundfenster, Stromsparen, Vorschaufenster) teils um den Faktor 40.
  // Bildtakt als Taktgeber, setTimeout als Notnagel. Browser halten requestAnimationFrame
  // an, sobald das Fenster nicht sichtbar ist; ohne den Notnagel bliebe der Vorspann dann
  // fuer immer am Anfang stehen (schwarzer Schirm). setTimeout laeuft auch im Hintergrund,
  // nur gedrosselt - das reicht, um weiterzukommen.
  const wait = ms => new Promise(res => {
    if (reduced || ms <= 0) return res();
    let fertig = false;
    const ende = () => { if (!fertig) { fertig = true; res(); } };
    const t0 = performance.now();
    (function f(now) { if (fertig) return; (now - t0 >= ms || skipped) ? ende() : requestAnimationFrame(f); })(t0);
    setTimeout(ende, ms + 40);
  });

  function tippen(pre, cur, line, cps) {
    return new Promise(res => {
      if (reduced || skipped) {
        for (const ch of line) { const s = document.createElement('span'); s.className = 'g';
                                 s.textContent = ch; pre.insertBefore(s, cur); }
        return res();
      }
      let i = 0, fertig = false;
      const t0 = performance.now();
      const setze = bis => {
        while (i < bis) {
          const s = document.createElement('span'); s.className = 'g'; s.textContent = line[i++];
          pre.insertBefore(s, cur);
        }
      };
      const ende = () => { if (!fertig) { fertig = true; setze(line.length); res(); } };
      (function f(now) {
        if (fertig) return;
        setze(Math.min(line.length, Math.floor((now - t0) / 1000 * cps)));
        (i >= line.length || skipped) ? ende() : requestAnimationFrame(f);
      })(t0);
      setTimeout(ende, (line.length / cps) * 1000 + 600);   // Notnagel, s. wait()
    });
  }

  // ================= Navigation aufbauen (unsichtbar, wird nach dem Boot enthuellt) ==========
  const buehne = $('#s-nav');
  let aktiv1 = null, aktiv2 = null, schliessUhr = null;

  function symbol(sym) {
    const t = document.getElementById('sym-' + sym);
    return t ? t.content.cloneNode(true) : document.createDocumentFragment();
  }
  function knoten(klasse, beschriftung, farbe, sym, i) {
    const el = document.createElement('div');
    el.className = 'knoten ' + klasse;
    el.style.setProperty('--f', farbe);
    el.style.setProperty('--i', i || 0);
    if (klasse.startsWith('ebene3')) {
      const p = document.createElement('div');
      p.className = 'pille'; p.textContent = beschriftung; el.appendChild(p);
    } else {
      const s = document.createElement('div');
      s.className = 'scheibe'; s.appendChild(symbol(sym));
      const t = document.createElement('div');
      t.className = 'titel'; t.textContent = beschriftung;
      el.append(s, t);
    }
    buehne.appendChild(el);
    return el;
  }

  const gruppen = BAUM.map((g, i) => {
    g.el = knoten('ebene1', g.name, g.farbe, g.sym, i);
    g.kinder.forEach((k, j) => {
      k.el = knoten('ebene2 blase', k.name, k.farbe, k.sym, j);
      k.themen_el = k.themen.map((t, m) => {
        const e = knoten('ebene3 blase', t, k.farbe, null, m);
        e.dataset.thema = t; return e;
      });
    });
    return g;
  });

  let mitte = { x:0, y:0 }, r1 = 0;
  function setzen(el, pos, d) {
    el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
    if (d) el.style.setProperty('--d', d + 'px');
  }
  function anordnen() {
    const w = buehne.clientWidth || innerWidth, h = buehne.clientHeight || innerHeight;
    mitte = { x:w/2, y:h/2 };
    r1 = Math.min(w, h) * 0.30;
    const d1 = Math.max(74, Math.min(112, r1 * 0.42));
    const start = -Math.PI / 2;
    gruppen.forEach((g, i) => {
      const a = start + (2 * Math.PI * i) / gruppen.length;
      g.pos = { x: mitte.x + Math.cos(a) * r1, y: mitte.y + Math.sin(a) * r1 };
      setzen(g.el, g.pos, d1);
      // Blasen faechern nach aussen. Danach wird der ganze Faecher so weit
      // zurueckgeschoben, dass er im Bild bleibt; sonst laufen die Knoten am
      // oberen und unteren Rand aus dem Schirm.
      const r2 = d1 * 1.5, spanne = Math.PI * 0.72;
      const punkte = [];
      g.kinder.forEach((k, j) => {
        const n = g.kinder.length;
        const b = n === 1 ? a : a - spanne/2 + (spanne * j) / (n - 1);
        k.pos = { x: g.pos.x + Math.cos(b) * r2, y: g.pos.y + Math.sin(b) * r2 };
        punkte.push({ p: k.pos, rand: d1 * 0.42 });
        const r3 = d1 * 1.2, spanne3 = Math.PI * 0.9;
        k.themen_pos = k.themen_el.map((e, m) => {
          const n3 = k.themen_el.length;
          const c = n3 === 1 ? b : b - spanne3/2 + (spanne3 * m) / (n3 - 1);
          const pt = { x: k.pos.x + Math.cos(c) * r3, y: k.pos.y + Math.sin(c) * r3 };
          punkte.push({ p: pt, rand: 90 });
          return pt;
        });
      });
      let dx = 0, dy = 0;
      punkte.forEach(q => {
        dx = Math.min(dx, q.p.x - q.rand);      // links raus
        dy = Math.min(dy, q.p.y - q.rand * 0.5);
      });
      punkte.forEach(q => {
        dx = Math.max(dx, q.p.x + q.rand - w);  // rechts raus
        dy = Math.max(dy, q.p.y + q.rand * 0.5 - h);
      });
      g.kinder.forEach(k => {
        k.pos = { x: k.pos.x - dx, y: k.pos.y - dy };
        setzen(k.el, k.pos, d1 * 0.62);
        k.themen_el.forEach((e, m) =>
          setzen(e, { x: k.themen_pos[m].x - dx, y: k.themen_pos[m].y - dy }, 0));
      });
    });
    const ringe = $('#ringe');
    ringe.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    ringe.innerHTML =
      '<circle cx="' + mitte.x + '" cy="' + mitte.y + '" r="' + (r1*0.44) + '" stroke-dasharray="2 6"/>' +
      '<circle cx="' + mitte.x + '" cy="' + mitte.y + '" r="' + r1 + '" class="lauf"/>' +
      '<circle cx="' + mitte.x + '" cy="' + mitte.y + '" r="' + (r1*1.42) + '" stroke-dasharray="1 9"/>';
  }

  function linien(paare) {
    const s = $('#linien');
    s.setAttribute('viewBox', '0 0 ' + (buehne.clientWidth||innerWidth) + ' ' + (buehne.clientHeight||innerHeight));
    s.innerHTML = paare.map(p => '<line x1="'+p[0].x+'" y1="'+p[0].y+'" x2="'+p[1].x+'" y2="'+p[1].y+'"/>').join('');
  }
  function alleZu() {
    gruppen.forEach(g => {
      g.el.classList.remove('abgeblendet');
      g.kinder.forEach(k => { k.el.classList.remove('auf'); k.themen_el.forEach(e => e.classList.remove('auf')); });
    });
    linien([]); aktiv1 = aktiv2 = null;
  }
  function oeffnen1(g) {
    clearTimeout(schliessUhr);
    if (aktiv1 === g) return;
    alleZu(); aktiv1 = g;
    gruppen.forEach(x => { if (x !== g) x.el.classList.add('abgeblendet'); });
    g.kinder.forEach(k => k.el.classList.add('auf'));
    linien(g.kinder.map(k => [g.pos, k.pos]));
  }
  function oeffnen2(g, k) {
    clearTimeout(schliessUhr);
    if (aktiv2 === k) return;
    if (aktiv2) aktiv2.themen_el.forEach(e => e.classList.remove('auf'));
    aktiv2 = k;
    k.themen_el.forEach(e => e.classList.add('auf'));
  }
  const spaeterZu = () => { clearTimeout(schliessUhr); schliessUhr = setTimeout(alleZu, 450); };

  gruppen.forEach(g => {
    g.el.addEventListener('mouseenter', () => oeffnen1(g));
    g.el.addEventListener('mouseleave', spaeterZu);
    g.el.addEventListener('click', () => panel(g.name, g.farbe, [g.name], g));
    g.kinder.forEach(k => {
      k.el.addEventListener('mouseenter', () => oeffnen2(g, k));
      k.el.addEventListener('mouseleave', spaeterZu);
      k.el.addEventListener('click', () => panel(k.name, k.farbe, [g.name, k.name], k));
      k.themen_el.forEach(e => {
        e.addEventListener('mouseenter', () => clearTimeout(schliessUhr));
        e.addEventListener('mouseleave', spaeterZu);
        e.addEventListener('click', () => panel(e.dataset.thema, k.farbe, [g.name, k.name, e.dataset.thema], null));
      });
    });
  });

  const zufall = (a, b) => Math.floor(a + Math.random() * (b - a));
  function panel(titel, farbe, pfad, obj) {
    const p = $('#panel');
    p.style.setProperty('--f', farbe);
    $('#titel').textContent = titel;
    $('#pfad').textContent = pfad.join('  ›  ');
    const themen = obj && obj.themen ? obj.themen.length : (obj && obj.kinder ? obj.kinder.length : 1);
    $('#zahlen').innerHTML =
      '<div><b>' + zufall(3, 40) + '</b>QUELLEN</div>' +
      '<div><b>' + zufall(400, 90000).toLocaleString('de-DE') + '</b>ABSCHNITTE</div>' +
      '<div><b>' + themen + '</b>THEMEN</div>';
    $('#liste').innerHTML = FUNKTIONEN.map(f =>
      '<button class="funktion" data-f="' + f.id + '"><b>' + f.name + '</b><span>' + f.text + '</span></button>').join('');
    $('#liste').querySelectorAll('.funktion').forEach(b =>
      b.addEventListener('click', () => hinweis(b.querySelector('b').textContent + ' · ' + titel)));
    p.classList.add('auf');
  }
  $('#zu').addEventListener('click', () => $('#panel').classList.remove('auf'));

  let hinweisUhr = null;
  function hinweis(text) {
    const h = $('#hinweis');
    h.textContent = 'DEMO: ' + text;
    h.classList.add('auf');
    clearTimeout(hinweisUhr);
    hinweisUhr = setTimeout(() => h.classList.remove('auf'), 2200);
  }

  // ================= Vorspann =====================================================
  async function boot() {
    const pre = $('#boot'); pre.innerHTML = '';
    const cur = document.createElement('span'); cur.className = 'cur'; pre.appendChild(cur);
    for (const line of LINES) {
      if (skipped) return;
      await tippen(pre, cur, line, 90);
      if (line.endsWith(' OK')) [...pre.querySelectorAll('span.g')].slice(-2).forEach(s => s.classList.add('ok'));
      if (line.endsWith('FOUND')) [...pre.querySelectorAll('span.g')].slice(-8).forEach(s => s.classList.add('warn'));
      pre.insertBefore(document.createTextNode('\n'), cur);
      await wait(line === '' ? 90 : 150 + Math.random() * 120);
    }
    await tippen(pre, cur, '████████████████████████', 26);
    await wait(420);
  }

  async function morph() {
    anordnen();
    const ziele = gruppen.map(g => g.pos);
    const glyphen = [...document.querySelectorAll('#boot span.g')];
    $('#boot .cur')?.remove();
    const anims = glyphen.map((g, i) => {
      const r = g.getBoundingClientRect(), t = ziele[i % ziele.length];
      const dx = t.x - (r.left + r.width/2) + (Math.random() - .5) * 60;
      const dy = t.y - (r.top + r.height/2) + (Math.random() - .5) * 60;
      return g.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:'translate(' + (dx*.35) + 'px,' + (dy*.35 - 60) + 'px) scale(1.4)', opacity:1, offset:.35 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.2)', opacity:0 }
      ], { duration: 900 + Math.random()*500, delay: Math.random()*350,
           easing:'cubic-bezier(.3,.7,.2,1)', fill:'forwards' }).finished;
    });
    await wait(600);
    $('#s-nav').classList.add('on');
    gruppen.forEach(g => g.el.classList.add('da'));
    $('#s-boot').classList.remove('on');
    await Promise.allSettled(anims);
  }

  async function stoerung(ms) {
    if (reduced) return;
    const g = $('#glitch');
    g.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('i');
      b.style.cssText = 'top:' + (Math.random()*100).toFixed(1) + '%;height:' + (.5 + Math.random()*3).toFixed(1) + '%;'
        + '--dx:' + ((Math.random()-.5)*18).toFixed(1) + 'vw;--t:' + (70 + Math.random()*90).toFixed(0) + 'ms;'
        + '--c:' + (Math.random() < .4 ? '#FF3DF5' : (Math.random() < .5 ? '#3FC8FF' : '#CFF7FF'));
      g.appendChild(b);
    }
    g.appendChild(document.createElement('b'));
    g.classList.add('on'); document.body.classList.add('glitching');
    await wait(ms);
    g.classList.remove('on'); document.body.classList.remove('glitching');
    g.innerHTML = '';
  }

  const neu = el => { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); };

  async function lauf() {
    document.body.classList.add('on');
    await wait(620);
    if (skipped) return;
    await stoerung(900);
    if (skipped) return;

    const vor = $('#preface');
    vor.querySelector('.wort').innerHTML = [...'WORLD RESET']
      .map((c, i) => '<span style="--i:' + i + '">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
    vor.classList.add('on');
    await wait(2400);
    vor.classList.remove('on');
    if (skipped) return;

    const box = $('#count'), num = $('#count-num');
    box.classList.add('on');
    for (const n of ['3','2','1']) {
      if (skipped) return;
      num.textContent = n;
      num.classList.remove('beat'); void num.offsetWidth; num.classList.add('beat');
      neu($('.ring-go')); neu($('.ring-in'));
      await wait(1000);
    }
    box.classList.remove('on');
    $('#s-count').classList.remove('on');
    await stoerung(340);
    if (skipped) return;
    $('#s-boot').classList.add('on');
    await boot();
    if (skipped) return;
    await morph();
    $('#skip')?.remove();
  }

  function skipAll() {
    skipped = true;
    document.body.classList.add('on');
    const st = $('#stage');
    st.style.animation = 'none'; st.style.transform = 'none'; st.style.opacity = '1';
    ['#s-count','#s-boot'].forEach(s => $(s).classList.remove('on'));
    anordnen();
    $('#s-nav').classList.add('on');
    gruppen.forEach(g => { g.el.style.opacity = 1; g.el.style.animation = 'none'; });
    $('#skip')?.remove();
  }

  $('#skip').addEventListener('click', skipAll);
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('#panel').classList.remove('auf'); alleZu(); }
  });
  addEventListener('resize', () => { anordnen(); if (aktiv1) oeffnen1(aktiv1); });

  anordnen();
  if (reduced) skipAll(); else lauf();
})();
</script>
</body>
