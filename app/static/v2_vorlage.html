<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUINTESSENZ V2</title>
<style>
  :root { --p:#3FC8FF; --h:#CFF7FF; --a:#FF8A00; --bg:#05080b; --dim:#17495c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--p); overflow:hidden;
              font:14px/1.45 "IBM Plex Mono","Courier Prime","Consolas",monospace;
              user-select:none; -webkit-user-select:none; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:90; opacity:.16;
                 background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.6) 2px 3px); }

  /* Ruhezustand ist "aus". body.on setzt "an" fest und spielt das Einschalten ab; kein
     animation-fill-mode, sonst nimmt eine spaetere Animation (Ruettler) den Endzustand mit. */
  #stage { position:relative; width:100%; height:100%; background:var(--bg);
           transform:scaleY(0); opacity:0; }
  body.on #stage { transform:none; opacity:1; animation:crt-on .85s cubic-bezier(.2,.9,.2,1); }
  body.on #stage::after { content:""; position:absolute; inset:0; background:#fff; opacity:0;
                          pointer-events:none; z-index:40; animation:crt-flicker 1.5s steps(1) .3s; }

  section { position:absolute; inset:0; display:grid; place-items:center; opacity:0;
            pointer-events:none; transition:opacity .45s; }
  section.on { opacity:1; pointer-events:auto; }

  /* ---------- Vorspann und Countdown ---------- */
  #s-count { text-align:center; }
  #preface { position:absolute; text-align:center; opacity:0; }
  #preface.on { opacity:1; animation:pre-out .5s ease-in 1.9s forwards; }
  #preface .wort { font-size:clamp(24px,6vw,68px); font-weight:700; letter-spacing:.3em; text-indent:.3em;
                   color:var(--h); text-shadow:0 0 30px var(--p),0 0 70px rgba(63,200,255,.45); white-space:nowrap; }
  #preface .wort span { display:inline-block; opacity:0; }
  #preface.on .wort span { animation:pre-letter .55s cubic-bezier(.2,.9,.2,1) forwards;
                           animation-delay:calc(var(--i) * 65ms); }
  #preface .strich { height:2px; margin:18px auto 0; width:0; background:var(--p); box-shadow:0 0 14px var(--p); }
  #preface.on .strich { animation:pre-line .9s cubic-bezier(.2,.9,.2,1) .55s forwards; }
  #preface .unter { margin-top:14px; font-size:11px; letter-spacing:.5em; text-indent:.5em; opacity:0; }
  #preface.on .unter { animation:pre-sub .6s ease-out 1.1s forwards; }

  #count { position:relative; width:min(46vmin,320px); aspect-ratio:1; display:grid; place-items:center;
           opacity:0; transition:opacity .3s; }
  #count.on { opacity:1; }
  #count svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #count circle { fill:none; transform:rotate(-90deg); transform-origin:100px 100px; }
  .ring-bg { stroke:var(--dim); stroke-width:1.5; stroke-dasharray:3 7; }
  .ring-go { stroke:var(--p); stroke-width:3.5; stroke-linecap:round; stroke-dasharray:540.35;
             stroke-dashoffset:540.35; filter:drop-shadow(0 0 8px var(--p)); }
  .ring-go.go { animation:ring-run 1s linear forwards; }
  .ring-in { stroke:var(--p); stroke-width:1; opacity:.35; }
  .ring-in.go { animation:ring-pulse 1s ease-out; }
  #count-num { position:relative; font-size:min(22vmin,150px); font-weight:700; line-height:1; color:var(--h);
               text-shadow:0 0 30px var(--p),0 0 60px rgba(63,200,255,.5); }
  #count-num.beat { animation:num-in .95s cubic-bezier(.2,.8,.2,1); }
  #count-cap { position:absolute; bottom:-8%; left:0; right:0; font-size:12px; letter-spacing:.45em;
               text-indent:.45em; opacity:.65; }

  /* ---------- Bildstoerung ---------- */
  #glitch { position:absolute; inset:0; z-index:35; pointer-events:none; opacity:0; overflow:hidden; }
  #glitch.on { opacity:1; }
  #glitch i { position:absolute; left:-10%; right:-10%; display:block; background:var(--c); opacity:.34;
              mix-blend-mode:screen; transform:translateX(var(--dx));
              animation:g-slice var(--t) steps(2) infinite alternate; }
  #glitch b { position:absolute; left:0; right:0; height:2px; background:var(--h); opacity:.75;
              box-shadow:0 0 24px var(--h); animation:g-sweep .5s linear infinite; }
  #glitch::after { content:""; position:absolute; inset:-20%; opacity:.1; mix-blend-mode:screen;
                   background:repeating-linear-gradient(0deg,rgba(255,255,255,.9) 0 1px,transparent 1px 5px);
                   animation:g-noise .08s steps(2) infinite; }
  body.glitching #stage { animation:g-shake .09s steps(2) infinite; }

  /* ---------- Systemcheck ---------- */
  #s-boot { place-items:start; padding:6vh 6vw; }
  #boot { margin:0; white-space:pre-wrap; font-size:clamp(12px,1.6vw,18px); line-height:1.7;
          color:var(--p); text-shadow:0 0 8px rgba(63,200,255,.6); }
  #boot .ok { color:#6CFF9A; }
  #boot .warn { color:var(--a); }
  #boot .cur { display:inline-block; width:.6em; height:1.1em; background:var(--p); vertical-align:-.2em;
               animation:blink .8s steps(1) infinite; }
  #boot span.g { display:inline-block; will-change:transform,opacity; }

  /* ---------- Navigation ---------- */
  #s-nav { display:block; }
  #ringe, #speichen { position:absolute; inset:0; pointer-events:none; }
  #ringe circle { fill:none; stroke:var(--dim); opacity:.45; }
  #ringe .lauf { stroke:var(--p); stroke-width:1.2; stroke-dasharray:4 12; opacity:.4;
                 transform-origin:center; animation:drehen 60s linear infinite; }
  #speichen line { stroke:var(--p); stroke-width:1; opacity:.2; stroke-dasharray:3 6;
                   animation:fliessen 1.8s linear infinite; }

  /* Lage ueber transform, damit die Bewegung fluessig bleibt */
  .knoten { position:absolute; left:0; top:0; width:var(--d,96px); cursor:pointer; z-index:3;
            transform:translate(calc(var(--x,0px) - 50%), calc(var(--y,0px) - 50%)) scale(var(--s,1));
            opacity:var(--o,1); pointer-events:none;
            transition:transform .55s cubic-bezier(.2,.9,.25,1.05), opacity .4s;
            will-change:transform,opacity; }
  .knoten.aktiv { pointer-events:auto; }
  .knoten svg { display:block; width:100%; height:auto; overflow:visible; }
  .knoten .titel { margin-top:11px; text-align:center; font-size:13.5px; letter-spacing:.1em;
                   line-height:1.35; color:var(--p); opacity:.8; text-shadow:0 0 8px rgba(0,0,0,.9); }
  .knoten.klein .titel { font-size:10.5px; opacity:.55; letter-spacing:.06em; }
  .knoten.klein .motiv { stroke-width:5.5; }
  .knoten.klein:hover .titel { opacity:1; }
  .knoten:hover { --s:1.12; }
  .knoten:hover .titel { color:var(--f,var(--h)); opacity:1; }
  .knoten:hover .rahmen { stroke:var(--f,var(--h)); opacity:.9; }
  /* Drei Ebenen, drei Farben: Strich hell, Schatten im Akzent, Ringe blau */
  .knoten:hover .motiv { stroke:var(--h); filter:drop-shadow(0 0 12px var(--akz,var(--p))); }
  .knoten.fokus { cursor:zoom-out; }
  .knoten.fokus .titel { font-size:18px; letter-spacing:.22em; color:var(--f,var(--h)); opacity:1; font-weight:700; }
  .knoten.fokus .motiv { stroke:var(--f,var(--h)); }
  .knoten.fokus .rahmen { stroke:var(--f,var(--h)); opacity:.5; }
  /* Symbole leben: drei Ringe drehen unterschiedlich schnell, das Motiv hat einen
     versetzten Akzentschatten. Beim Ueberfahren laeuft alles vier- bis fuenfmal
     schneller, das Motiv wird hell, der Akzent voll sichtbar. */
  .knoten svg * { transform-box:view-box; transform-origin:50px 50px; }
  .motiv { fill:none; stroke:var(--p); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;
           transition:stroke .25s; }
  .geist { fill:none; stroke:var(--akz,#FF8A00); stroke-width:4.5; stroke-linecap:round;
           stroke-linejoin:round; opacity:.3; transform:translate(2px,2px);
           animation:geist-atmen 3.6s ease-in-out infinite; animation-delay:var(--ph,0s);
           transition:opacity .25s, stroke .25s; }
  .rahmen { fill:none; stroke:var(--dim); stroke-width:1.4; }
  .r-aussen { stroke-dasharray:16 9; animation:dreh 26s linear infinite; animation-delay:var(--ph,0s); }
  .r-innen  { stroke-dasharray:2 6; opacity:.6; animation:dreh 17s linear infinite reverse;
              animation-delay:var(--ph,0s); }
  .ping     { fill:none; stroke:var(--akz,#FF8A00); stroke-width:1.6; opacity:0; }
  .r-marke  { stroke:var(--akz,#FF8A00); stroke-width:2.6; stroke-linecap:round;
              stroke-dasharray:9 336; opacity:.85; animation:dreh 9s linear infinite;
              animation-delay:var(--ph,0s); }
  .knoten:hover .r-aussen { animation-duration:5s; }
  .knoten:hover .r-innen  { animation-duration:3.4s; opacity:1; }
  .knoten:hover .r-marke  { animation-duration:1.7s; stroke-width:3.4; }
  .knoten:hover .geist    { opacity:.9; animation-duration:.9s; stroke:var(--akz,#FF8A00); }
  .knoten:hover .ping     { animation:ping 1.15s ease-out infinite; }
  .knoten.fokus .r-aussen { animation-duration:14s; }
  .knoten.fokus .r-marke  { animation-duration:5s; }
  .knoten.fokus .geist    { opacity:.5; }

  #mitte { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center;
           pointer-events:none; z-index:2; transition:opacity .4s; }
  #mitte b { display:block; font-size:clamp(16px,2.2vw,28px); letter-spacing:.42em; text-indent:.42em;
             color:var(--h); text-shadow:0 0 26px var(--p); font-weight:700; }
  #mitte span { display:block; margin-top:8px; font-size:10px; letter-spacing:.42em; text-indent:.42em; opacity:.5; }

  #pfad { position:absolute; left:0; right:0; top:26px; text-align:center; font-size:11px;
          letter-spacing:.24em; opacity:.55; z-index:5; pointer-events:none; }
  #hilfe { position:absolute; left:0; right:0; bottom:22px; text-align:center; font-size:10px;
           letter-spacing:.2em; opacity:.3; z-index:5; pointer-events:none; }
  #zurueck { position:absolute; left:24px; top:22px; z-index:6; font:inherit; font-size:11px;
             letter-spacing:.2em; color:var(--p); background:none; border:1px solid var(--dim);
             padding:7px 11px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .3s; }
  #zurueck.auf { opacity:.7; pointer-events:auto; }
  #zurueck:hover { opacity:1; border-color:var(--h); color:var(--h); }

  #hinweis { position:absolute; left:50%; bottom:64px; transform:translateX(-50%); z-index:30;
             padding:12px 20px; border:1px solid var(--fh,var(--a)); border-radius:4px; color:var(--fh,var(--a));
             background:rgba(6,16,22,.96); font-size:11.5px; letter-spacing:.1em; opacity:0;
             pointer-events:none; transition:opacity .3s; text-align:center; max-width:min(520px,86vw); }
  #hinweis.auf { opacity:1; }
  #hinweis b { display:block; letter-spacing:.2em; margin-bottom:5px; }
  #hinweis span { opacity:.75; font-size:10.5px; letter-spacing:.04em; }

  .skip { position:fixed; right:18px; bottom:14px; font-size:11px; letter-spacing:.2em; opacity:.5; z-index:60;
          color:var(--p); border:1px solid var(--dim); padding:6px 10px; cursor:pointer; background:none;
          font-family:inherit; }
  .skip:hover { opacity:1; border-color:var(--p); }

  @keyframes crt-on { 0% { transform:scaleY(.004) scaleX(.6); opacity:0; }
                      18% { transform:scaleY(.004) scaleX(1); opacity:1; }
                      100% { transform:scaleY(1) scaleX(1); opacity:1; } }
  @keyframes crt-flicker { 0%,6%,12%,100% { opacity:0; } 3% { opacity:.5; } 9% { opacity:.18; } }
  @keyframes pre-letter { 0% { opacity:0; transform:translateY(14px) scale(1.25); filter:blur(7px); }
                          100% { opacity:1; transform:none; filter:blur(0); } }
  @keyframes pre-line { to { width:min(62vw,520px); } }
  @keyframes pre-sub { to { opacity:.6; } }
  @keyframes pre-out { to { opacity:0; transform:scale(1.06); filter:blur(3px); } }
  @keyframes ring-run { from { stroke-dashoffset:540.35; } to { stroke-dashoffset:0; } }
  @keyframes ring-pulse { 0% { transform:rotate(-90deg) scale(1); opacity:.45; }
                          100% { transform:rotate(-90deg) scale(1.25); opacity:0; } }
  @keyframes num-in { 0% { opacity:0; transform:scale(1.7); filter:blur(6px); }
                      22% { opacity:1; transform:scale(1); filter:blur(0); }
                      80% { opacity:1; } 100% { opacity:.15; transform:scale(.94); } }
  @keyframes g-slice { from { transform:translateX(var(--dx)); } to { transform:translateX(calc(var(--dx) * -.7)); } }
  @keyframes g-sweep { from { top:-4%; } to { top:104%; } }
  @keyframes g-noise { 0% { transform:translateY(0); } 100% { transform:translateY(3px); } }
  @keyframes g-shake { 0% { transform:translate(0,0); } 33% { transform:translate(-6px,2px) skewX(.6deg); }
                       66% { transform:translate(5px,-2px) skewX(-.5deg); } 100% { transform:translate(0,0); } }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:.15; } }
  @keyframes drehen { to { transform:rotate(360deg); } }
  @keyframes dreh { to { transform:rotate(360deg); } }
  @keyframes ping { 0% { transform:scale(.72); opacity:.75; }
                    100% { transform:scale(1.18); opacity:0; } }
  @keyframes geist-atmen { 0%,100% { transform:translate(2px,2px); }
                           50% { transform:translate(-2px,-1px); } }
  @keyframes fliessen { to { stroke-dashoffset:-18; } }
  @media (prefers-reduced-motion:reduce) { * { animation-duration:.001s !important; } }
</style>
</head>
<body>
<!--SYMBOLE-->

<div id="stage">

  <section id="s-count" class="on">
    <div id="preface">
      <div class="wort"></div>
      <div class="strich"></div>
      <div class="unter">STAND BY</div>
    </div>
    <div id="count">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="86"/>
        <circle class="ring-in" cx="100" cy="100" r="70"/>
        <circle class="ring-go" cx="100" cy="100" r="86"/>
      </svg>
      <div id="count-num" aria-live="polite">3</div>
      <div id="count-cap">RESET SEQUENCE</div>
    </div>
  </section>
  <div id="glitch" aria-hidden="true"></div>

  <section id="s-boot"><pre id="boot"></pre></section>

  <section id="s-nav">
    <svg id="ringe"></svg>
    <svg id="speichen"></svg>
    <div id="mitte"><b>QUINTESSENZ</b><span>V2 &middot; KNOWLEDGE TERMINAL</span></div>
    <div id="pfad"></div>
    <button id="zurueck" type="button">&#9666; BACK</button>
    <div id="hilfe">SELECT A SYMBOL &middot; ESC OR CENTRE = BACK</div>
  </section>

  <div id="hinweis"></div>
</div>
<button class="skip" id="skip" type="button">SKIP INTRO &#9656;</button>

<script>
(() => {
  const BAUM = /*BAUM*/;
  const FUNKTIONEN = /*FUNKTIONEN*/;
  const LINES = /*BOOT*/;
  const $ = s => document.querySelector(s);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skipped = false;

  // Bildtakt als Taktgeber, setTimeout als Notnagel. Browser halten requestAnimationFrame
  // an, sobald das Fenster nicht sichtbar ist; ohne den Notnagel bliebe der Vorspann dann
  // fuer immer am Anfang stehen. setTimeout laeuft auch im Hintergrund, nur gedrosselt.
  const wait = ms => new Promise(res => {
    if (reduced || ms <= 0) return res();
    let fertig = false;
    const ende = () => { if (!fertig) { fertig = true; res(); } };
    const t0 = performance.now();
    (function f(now) { if (fertig) return; (now - t0 >= ms || skipped) ? ende() : requestAnimationFrame(f); })(t0);
    setTimeout(ende, ms + 40);
  });

  function tippen(pre, cur, line, cps) {
    return new Promise(res => {
      if (reduced || skipped) {
        for (const ch of line) { const s = document.createElement('span'); s.className = 'g';
                                 s.textContent = ch; pre.insertBefore(s, cur); }
        return res();
      }
      let i = 0, fertig = false;
      const t0 = performance.now();
      const setze = bis => {
        while (i < bis) {
          const s = document.createElement('span'); s.className = 'g'; s.textContent = line[i++];
          pre.insertBefore(s, cur);
        }
      };
      const ende = () => { if (!fertig) { fertig = true; setze(line.length); res(); } };
      (function f(now) {
        if (fertig) return;
        setze(Math.min(line.length, Math.floor((now - t0) / 1000 * cps)));
        (i >= line.length || skipped) ? ende() : requestAnimationFrame(f);
      })(t0);
      setTimeout(ende, (line.length / cps) * 1000 + 600);
    });
  }

  // ================= Navigation ===============================================
  const buehne = $('#s-nav');
  const alle = [];
  let pfad = [];

  const NS = 'http://www.w3.org/2000/svg';
  function motiv(glyph, klasse) {
    const u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#g-' + glyph);
    u.setAttribute('class', klasse || 'motiv');
    return u;
  }

  function baueKnoten(daten, eltern) {
    const el = document.createElement('div');
    el.className = 'knoten';
    const farbe = daten.farbe || (eltern && eltern.farbe) || null;
    if (farbe) el.style.setProperty('--f', farbe);
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '-8 -8 116 116');
    const ring = (r, klasse) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 50); c.setAttribute('cy', 50); c.setAttribute('r', r);
      c.setAttribute('class', klasse);
      return c;
    };
    // Akzentfarbe: bei gefaerbten Bereichen deren Farbe, sonst Amber
    el.style.setProperty('--akz', farbe || '#FF8A00');
    // Jeder Knoten laeuft mit eigener Phase, sonst drehen alle im Gleichschritt
    el.style.setProperty('--ph', (-(alle.length * 1.7) % 26).toFixed(1) + 's');
    s.append(ring(55, 'rahmen r-aussen'), ring(48, 'rahmen r-innen'), ring(55, 'ping'),
             ring(53.5, 'r-marke'), motiv(daten.glyph, 'geist'), motiv(daten.glyph, 'motiv'));
    const t = document.createElement('div');
    t.className = 'titel'; t.textContent = daten.name;
    el.append(s, t);
    buehne.appendChild(el);
    daten.el = el; daten.farbe = farbe; daten.eltern = eltern || null;
    alle.push(daten);
    el.addEventListener('click', e => { e.stopPropagation(); waehle(daten); });
    (daten.kinder || []).forEach(x => baueKnoten(x, daten));
    return daten;
  }

  BAUM.forEach(x => baueKnoten(x, null));
  const funk = FUNKTIONEN.map(f =>
    baueKnoten({ id:f.id, name:f.name, glyph:f.glyph, kinder:[], funktion:f }, null));

  const kinderVon = kn => !kn ? BAUM : ((kn.kinder && kn.kinder.length) ? kn.kinder : funk);

  function setze(d, x, y, groesse, skala, sichtbar, fokus) {
    const el = d.el;
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    el.style.setProperty('--d', groesse + 'px');
    el.style.setProperty('--s', skala);
    el.style.setProperty('--o', sichtbar ? 1 : 0);
    el.classList.toggle('aktiv', sichtbar);
    el.classList.toggle('fokus', !!fokus);
  }

  function ringLegen(liste, mx, my, R, dMax, klein, versatz) {
    const n = liste.length || 1;
    const platz = n > 1 ? (2 * Math.PI * R) / n : 240;
    const d = Math.max(klein ? 44 : 54, Math.min(dMax, platz * 0.64));
    // Der aeussere Ring wird um einen halben Schritt gedreht, sonst steht jede
    // Funktion genau ueber einem Unterpunkt und oben in der Pfadzeile.
    const start = -Math.PI / 2 + (versatz || 0), punkte = [];
    liste.forEach((x, i) => {
      const a = start + (2 * Math.PI * i) / n;
      const px = mx + Math.cos(a) * R, py = my + Math.sin(a) * R;
      setze(x, px, py, d, 1, true, false);
      x.el.classList.toggle('klein', !!klein);
      x.el.style.transitionDelay = (i * 32) + 'ms';
      setTimeout(() => { x.el.style.transitionDelay = ''; }, 800);
      punkte.push([px, py]);
    });
    return punkte;
  }

  function zeichne() {
    const w = innerWidth, h = innerHeight;
    const mx = w / 2, my = h / 2;
    const fokus = pfad[pfad.length - 1] || null;
    const eigene = (fokus && fokus.kinder && fokus.kinder.length) ? fokus.kinder : null;
    const m = Math.min(w, h);

    alle.forEach(x => setze(x, mx, my, 90, .25, false, false));
    if (fokus) setze(fokus, mx, my, 118, 1, true, true);
    $('#mitte').style.opacity = fokus ? 0 : 1;

    // Innerer Ring: Unterpunkte, sonst die KI-Funktionen.
    // Aeusserer Ring: die KI-Funktionen, sobald es Unterpunkte gibt. Damit sind sie
    // auf jeder Ebene erreichbar, nicht erst ganz unten.
    let Ri, punkte = [], ringe2 = '';
    if (!fokus) {
      Ri = m * 0.33;
      punkte = ringLegen(BAUM, mx, my, Ri, 112, false);
    } else if (eigene) {
      Ri = m * 0.26;
      const Ra = m * 0.40;
      punkte = ringLegen(eigene, mx, my, Ri, 96, false);
      ringLegen(funk, mx, my, Ra, 62, true, Math.PI / funk.length);
      ringe2 = '<circle cx="' + mx + '" cy="' + my + '" r="' + Ra + '" stroke-dasharray="3 9"/>';
    } else {
      Ri = m * 0.31;
      punkte = ringLegen(funk, mx, my, Ri, 104, false);
    }

    const ringe = $('#ringe'), sp = $('#speichen');
    ringe.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    sp.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    ringe.innerHTML =
      '<circle cx="' + mx + '" cy="' + my + '" r="' + (Ri * 0.46) + '" stroke-dasharray="2 7"/>' +
      '<circle cx="' + mx + '" cy="' + my + '" r="' + Ri + '" class="lauf"/>' + ringe2;
    sp.innerHTML = punkte.map(p =>
      '<line x1="' + mx + '" y1="' + my + '" x2="' + p[0] + '" y2="' + p[1] + '"/>').join('');

    $('#pfad').textContent = pfad.map(x => x.name).join('   >   ');
    $('#zurueck').classList.toggle('auf', pfad.length > 0);
  }

  function waehle(d) {
    if (d.funktion) { hinweis(d.funktion); return; }
    if (pfad[pfad.length - 1] === d) { zurueck(); return; }
    pfad = [];
    let x = d;
    while (x) { pfad.unshift(x); x = x.eltern; }
    zeichne();
  }
  function zurueck() { pfad.pop(); zeichne(); }

  let hinweisUhr = null;
  function hinweis(f) {
    const el = $('#hinweis');
    const wo = pfad.length ? pfad[pfad.length - 1] : null;
    el.innerHTML = '<b>' + f.name + (wo ? ' &middot; ' + wo.name : '') + '</b><span>' + f.text + '</span>';
    el.style.setProperty('--fh', (wo && wo.farbe) || '#FF8A00');
    el.classList.add('auf');
    clearTimeout(hinweisUhr);
    hinweisUhr = setTimeout(() => el.classList.remove('auf'), 3200);
  }

  $('#zurueck').addEventListener('click', e => { e.stopPropagation(); zurueck(); });
  // Kein Zurueck bei Klick auf den Hintergrund: ein Klick knapp neben ein Symbol
  // haette sonst ungewollt eine Ebene geschlossen. Zurueck geht ueber den Knopf,
  // ueber Escape oder ueber das Symbol in der Mitte.
  addEventListener('keydown', e => { if (e.key === 'Escape' && pfad.length) zurueck(); });
  addEventListener('resize', zeichne);

  // ================= Vorspann =================================================
  async function boot() {
    const pre = $('#boot'); pre.innerHTML = '';
    const cur = document.createElement('span'); cur.className = 'cur'; pre.appendChild(cur);
    for (const line of LINES) {
      if (skipped) return;
      await tippen(pre, cur, line, 90);
      if (line.endsWith(' OK')) [...pre.querySelectorAll('span.g')].slice(-2).forEach(s => s.classList.add('ok'));
      if (line.endsWith('FOUND')) [...pre.querySelectorAll('span.g')].slice(-8).forEach(s => s.classList.add('warn'));
      pre.insertBefore(document.createTextNode('\n'), cur);
      await wait(line === '' ? 90 : 150 + Math.random() * 120);
    }
    await tippen(pre, cur, '████████████████', 22);
    await wait(420);
  }

  async function morph() {
    zeichne();
    const ziele = BAUM.map(g => {
      const r = g.el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
    const glyphen = [...document.querySelectorAll('#boot span.g')];
    const cur = $('#boot .cur'); if (cur) cur.remove();
    const anims = glyphen.map((g, i) => {
      const r = g.getBoundingClientRect(), t = ziele[i % ziele.length];
      const dx = t.x - (r.left + r.width / 2) + (Math.random() - .5) * 60;
      const dy = t.y - (r.top + r.height / 2) + (Math.random() - .5) * 60;
      return g.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:'translate(' + (dx*.35) + 'px,' + (dy*.35 - 60) + 'px) scale(1.4)', opacity:1, offset:.35 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.2)', opacity:0 }
      ], { duration: 900 + Math.random()*500, delay: Math.random()*350,
           easing:'cubic-bezier(.3,.7,.2,1)', fill:'forwards' }).finished;
    });
    await wait(600);
    $('#s-nav').classList.add('on');
    $('#s-boot').classList.remove('on');
    await Promise.allSettled(anims);
  }

  async function stoerung(ms) {
    if (reduced) return;
    const g = $('#glitch');
    g.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('i');
      b.style.cssText = 'top:' + (Math.random()*100).toFixed(1) + '%;height:' + (.5 + Math.random()*3).toFixed(1) + '%;'
        + '--dx:' + ((Math.random()-.5)*18).toFixed(1) + 'vw;--t:' + (70 + Math.random()*90).toFixed(0) + 'ms;'
        + '--c:' + (Math.random() < .4 ? '#FF3DF5' : (Math.random() < .5 ? '#3FC8FF' : '#CFF7FF'));
      g.appendChild(b);
    }
    g.appendChild(document.createElement('b'));
    g.classList.add('on'); document.body.classList.add('glitching');
    await wait(ms);
    g.classList.remove('on'); document.body.classList.remove('glitching');
    g.innerHTML = '';
  }

  const neu = el => { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); };

  async function lauf() {
    document.body.classList.add('on');
    await wait(620);
    if (skipped) return;
    await stoerung(900);
    if (skipped) return;

    const vor = $('#preface');
    vor.querySelector('.wort').innerHTML = [...'WORLD RESET']
      .map((c, i) => '<span style="--i:' + i + '">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
    vor.classList.add('on');
    await wait(2400);
    vor.classList.remove('on');
    if (skipped) return;

    const box = $('#count'), num = $('#count-num');
    box.classList.add('on');
    for (const n of ['3','2','1']) {
      if (skipped) return;
      num.textContent = n;
      num.classList.remove('beat'); void num.offsetWidth; num.classList.add('beat');
      neu($('.ring-go')); neu($('.ring-in'));
      await wait(1000);
    }
    box.classList.remove('on');
    $('#s-count').classList.remove('on');
    await stoerung(340);
    if (skipped) return;
    $('#s-boot').classList.add('on');
    await boot();
    if (skipped) return;
    await morph();
    const sk = $('#skip'); if (sk) sk.remove();
  }

  function skipAll() {
    skipped = true;
    document.body.classList.add('on');
    const st = $('#stage');
    st.style.animation = 'none'; st.style.transform = 'none'; st.style.opacity = '1';
    $('#s-count').classList.remove('on');
    $('#s-boot').classList.remove('on');
    $('#s-nav').classList.add('on');
    zeichne();
    const sk = $('#skip'); if (sk) sk.remove();
  }

  $('#skip').addEventListener('click', e => { e.stopPropagation(); skipAll(); });

  zeichne();
  if (reduced) skipAll(); else lauf();
})();
</script>
</body>
</html>
